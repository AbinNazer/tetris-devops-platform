apiVersion: v1
kind: ConfigMap
metadata:
  name: tetris-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"    # Sidecar watches for this label
data:
  tetris-dashboard.json: |
    {
      "title": "Tetris App Dashboard",
      "uid": "tetris-app",
      "tags": ["tetris", "kubernetes"],
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Total Scores Submitted",
          "type": "stat",
          "gridPos": {"x":0,"y":0,"w":4,"h":4},
          "targets": [{
            "expr": "tetris_scores_submitted_total",
            "legendFormat": "Scores"
          }]
        },
        {
          "id": 2,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "gridPos": {"x":4,"y":0,"w":10,"h":8},
          "targets": [{
            "expr": "rate(tetris_request_total[5m])",
            "legendFormat": "{{method}} {{endpoint}} {{status}}"
          }]
        },
        {
          "id": 3,
          "title": "API Latency (p99)",
          "type": "timeseries",
          "gridPos": {"x":14,"y":0,"w":10,"h":8},
          "targets": [{
            "expr": "histogram_quantile(0.99, rate(tetris_request_duration_seconds_bucket[5m]))",
            "legendFormat": "p99 {{endpoint}}"
          }]
        },
        {
          "id": 4,
          "title": "Backend Pod CPU",
          "type": "timeseries",
          "gridPos": {"x":0,"y":8,"w":12,"h":8},
          "targets": [{
            "expr": "rate(container_cpu_usage_seconds_total{namespace='tetris',container='backend'}[5m])",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 5,
          "title": "Backend Pod Memory",
          "type": "timeseries",
          "gridPos": {"x":12,"y":8,"w":12,"h":8},
          "targets": [{
            "expr": "container_memory_usage_bytes{namespace='tetris',container='backend'}",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 6,
          "title": "Pod Restarts",
          "type": "stat",
          "gridPos": {"x":0,"y":16,"w":6,"h":4},
          "targets": [{
            "expr": "increase(kube_pod_container_status_restarts_total{namespace='tetris'}[1h])",
            "legendFormat": "Restarts (1h)"
          }]
        },
        {
          "id": 7,
          "title": "Running Pods",
          "type": "stat",
          "gridPos": {"x":6,"y":16,"w":6,"h":4},
          "targets": [{
            "expr": "count(kube_pod_status_phase{namespace='tetris',phase='Running'})",
            "legendFormat": "Running Pods"
          }]
        }
      ],
      "schemaVersion": 36
    }
