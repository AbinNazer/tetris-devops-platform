apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: tetris
  labels:
    app: postgres
    app.kubernetes.io/name: tetris
spec:
  accessModes:
    - ReadWriteOnce       # Only one node can mount at a time (correct for DB)
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tetris
  labels:
    app: postgres
    app.kubernetes.io/name: tetris
    tier: database
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      # Security context: run as non-root
      securityContext:
        runAsUser: 999       # postgres user UID
        runAsGroup: 999
        fsGroup: 999

      containers:
        - name: postgres
          image: postgres:16-alpine   # Alpine = smaller, more secure image
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tetris-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tetris-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tetris-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data


          resources:
            requests:
              cpu: "100m"      # 100 millicores = 0.1 CPU
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "tetris", "-d", "tetrisdb"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          # Readiness probe: don't send traffic until DB is ready
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tetris", "-d", "tetrisdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: tetris
  labels:
    app: postgres
    app.kubernetes.io/name: tetris
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP        
