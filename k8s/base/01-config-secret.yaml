apiVersion: v1
kind: ConfigMap
metadata:
  name: tetris-config
  namespace: tetris
  labels:
    app.kubernetes.io/name: tetris
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "tetrisdb"
  DB_USER: "tetris"
  FLASK_ENV: "production"
  PORT:     "5000"
  APP_VERSION: "1.0.0"

apiVersion: v1
kind: Secret
metadata:
  name: tetris-secret
  namespace: tetris
  labels:
    app.kubernetes.io/name: tetris
type: Opaque
data:
  # echo -n "tetrispassword" | base64  →  dGV0cmlzcGFzc3dvcmQ=
  DB_PASSWORD: dGV0cmlzcGFzc3dvcmQ=
  # echo -n "tetris"         | base64  →  dGV0cmlz
  POSTGRES_USER: dGV0cmlz
  # echo -n "tetrisdb"       | base64  →  dGV0cmlzZGI=
  POSTGRES_DB: dGV0cmlzZGI=
