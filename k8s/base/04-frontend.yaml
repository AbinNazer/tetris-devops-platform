# k8s/base/04-frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tetris
  labels:
    app: frontend
    app.kubernetes.io/name: tetris
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101       # nginx user

      terminationGracePeriodSeconds: 30

      containers:
        - name: frontend
          # Using the public bsord/tetris image — tag it to your Docker Hub if needed
          image: bsord/tetris:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]   # Nginx needs to bind port 80

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: frontend

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: tetris
  labels:
    app: frontend
    app.kubernetes.io/name: tetris
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP    # Exposed externally via Ingress (preferred over NodePort/LB per service)

---
# ──────────────────────────────────────────────────────────────
# Ingress — Single entry point for all external traffic
# Routes:
#   /       → frontend-service:80
#   /api/*  → backend-service:5000  (strip /api prefix)
#
# Requires: nginx ingress controller installed
#   Minikube: minikube addons enable ingress
#   Others:   helm install ingress-nginx ingress-nginx/ingress-nginx
# ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tetris-ingress
  namespace: tetris
  labels:
    app.kubernetes.io/name: tetris
  annotations:
    kubernetes.io/ingress.class: nginx
    # Rewrite /api/score → /score before forwarding to backend
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN";
      add_header X-Content-Type-Options "nosniff";
      add_header X-XSS-Protection "1; mode=block";
    # Rate limiting (protect API from abuse)
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  rules:
    - host: tetris.local          # Replace with your domain in production
      http:
        paths:
          # API path — strip /api prefix and forward to backend
          - path: /api(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          # Frontend — catch all remaining traffic
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

